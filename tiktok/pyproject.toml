[project]
name = "tiktok-discourse"
version = "0.1.0"
description = "Longitudinal analysis of Venezuela discourse on TikTok (2013-2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Hunjun Shin" }
]
keywords = ["tiktok", "nlp", "discourse-analysis", "venezuela", "social-media"]

dependencies = [
    "TikTokResearchApi>=0.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "playwright>=1.58.0",
]
