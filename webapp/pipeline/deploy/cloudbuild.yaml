# Cloud Build config for the ETL pipeline Cloud Run Job
# Build and deploy: gcloud builds submit --config deploy/cloudbuild.yaml .

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pipeline-etl:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/pipeline-etl:latest'
      - '-f'
      - 'webapp/pipeline/Dockerfile'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pipeline-etl:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pipeline-etl:latest']

  # Deploy as Cloud Run Job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'create'
      - 'pipeline-etl-daily'
      - '--image=gcr.io/$PROJECT_ID/pipeline-etl:$SHORT_SHA'
      - '--region=us-central1'
      - '--memory=4Gi'
      - '--cpu=2'
      - '--task-timeout=3600s'
      - '--max-retries=1'
      - '--set-env-vars'
      - 'GCP_PROJECT=$PROJECT_ID'

images:
  - 'gcr.io/$PROJECT_ID/pipeline-etl:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/pipeline-etl:latest'
